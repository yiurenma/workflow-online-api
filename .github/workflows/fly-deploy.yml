# Deploy to Fly.io on push to main (and manual run).
#
# Setup (once):
# 1. flyctl auth login
# 2. fly apps create workflow-online-api   # must match fly.toml `app =`
# 3. fly secrets set SPRING_DATASOURCE_URL="jdbc:postgresql://..." SPRING_DATASOURCE_USERNAME="..." SPRING_DATASOURCE_PASSWORD="..." 
#    (use real JDBC URL; P6Spy optional — e.g. jdbc:postgresql://... if you skip p6spy in prod)
# 4. Create a deploy token (Fly dashboard → Access Tokens, or `fly tokens create deploy`),
#    then GitHub repo → Settings → Secrets → Actions → FLY_API_TOKEN
#
name: Deploy to Fly.io

permissions:
  contents: read

# Quiet Node 20 deprecation on Actions until all vendors ship Node 24–based actions
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: fly-deploy-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn test
        run: mvn -B -DskipITs test
        env:
          SPRING_PROFILES_ACTIVE: test

  deploy:
    name: Deploy app
    needs: test
    runs-on: ubuntu-latest
    # Optional: limit deploys to your default branch only when triggered by push
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v6

      # Pinned release (avoid @master); see github.com/superfly/flyctl-actions/releases
      - uses: superfly/flyctl-actions/setup-flyctl@1.5

      - name: fly deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
