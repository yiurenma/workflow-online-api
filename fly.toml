# Fly app name (globally unique on fly.io). If taken, add a suffix, e.g. workflow-online-api-yourorg
# Create: fly apps create workflow-online-api

app = "workflow-online-api"
primary_region = "iad"

[build]

[env]
  SERVER_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
